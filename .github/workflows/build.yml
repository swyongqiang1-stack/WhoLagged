name: Build and Publish StutterFix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   

jobs:
  build:
    runs-on: windows-latest   

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish
      run: >
        dotnet publish
        -c Release
        -r win-x64
        --self-contained false
        -p:PublishSingleFile=true
        -o ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: StutterFix-exe
        path: ./publish/StutterFix.exe
